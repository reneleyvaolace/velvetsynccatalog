<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Velvet Sync</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D0D12; color: #FFF; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1A1A2E; padding: 40px; border-radius: 16px; border: 1px solid #33334D; width: 100%; max-width: 400px; box-sizing: border-box; }
        h1 { color: #E91E63; margin-bottom: 20px; font-size: 24px; }
        .error { color: #FF4444; margin-bottom: 15px; }
        .success { color: #00C851; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #33334D; border-radius: 8px; background: #0D0D12; color: #FFF; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #E91E63; color: #FFF; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .links { margin-top: 20px; text-align: center; }
        .links a { color: #4A90E2; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Restablecer Contraseña</h1>
        <div id="status"></div>
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="Nueva contraseña" required />
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required />
            <button type="submit" id="submitBtn">Restablecer Contraseña</button>
        </form>
        <div class="links">
            <a href="https://velvetsynccatalog.vercel.app/">← Volver al Catálogo</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');

        if (!accessToken) {
            document.getElementById('status').innerHTML = '<div class="error">❌ Token de restablecimiento no válido</div>';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            if (newPassword !== confirmPassword) {
                status.innerHTML = '<div class="error">❌ Las contraseñas no coinciden</div>';
                return;
            }

            if (newPassword.length < 6) {
                status.innerHTML = '<div class="error">❌ La contraseña debe tener al menos 6 caracteres</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const supabaseUrl = 'https://baeclricgedhxdtmirid.supabase.co';
                const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZWNscmljZ2VkaHhkdG1pcmlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMTUwMjYsImV4cCI6MjA4ODU5MTAyNn0.lPUuU6RiUGyaf36NJH4HysIkgTe8qFxt4CxA5OnjvjU';

                const response = await fetch(`${supabaseUrl}/auth/v1/update`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: newPassword }),
                });

                if (response.ok) {
                    status.innerHTML = '<div class="success">✅ Contraseña actualizada correctamente</div>';
                    btn.disabled = true;
                    btn.textContent = 'Listo';
                } else {
                    const error = await response.json();
                    status.innerHTML = `<div class="error">❌ ${error.message || 'Error al cambiar contraseña'}</div>`;
                    btn.disabled = false;
                    btn.textContent = 'Intentar de nuevo';
                }
            } catch (err) {
                status.innerHTML = '<div class="error">❌ Error de conexión</div>';
                btn.disabled = false;
                btn.textContent = 'Intentar de nuevo';
            }
        });
    </script>
</body>
</html>
